aid: cheddar
name: Cheddar
description: >-
  Cheddar is a business and technology news media company producing live and on-demand video,
  articles, and newsletters covering financial markets, technology, innovation, entrepreneurship,
  and culture for a modern digital audience. Founded as a millennial-focused financial news network
  and backed by Lightspeed Venture Partners, Ribbit Capital, Comcast Ventures, and Altice USA,
  Cheddar streams programming such as Opening Bell, Big Business This Week, and NYSE TV Live across
  its website, connected-TV apps, and social platforms. It operates as a digital media and content
  publisher rather than an API or developer-platform company; this profile tracks Cheddar within the
  API Evangelist network and carries no public developer API surface at this time.
